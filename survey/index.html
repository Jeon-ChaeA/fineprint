<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>fineprint 설문 · 마감되었습니다</title>
<meta name="description" content="fineprint 금융 약관 설문은 마감되었습니다. 참여해 주셔서 감사합니다.">
<meta property="og:title" content="fineprint 설문이 마감되었습니다">
<meta property="og:description" content="참여해 주셔서 감사합니다 · fineprint 프로젝트">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f7f5ef; --paper:#fffdf8; --ink:#1d1c19; --ink-2:#5b5852; --ink-3:#8b877e;
  --line:#e4dfd3; --accent:#1f4fd6; --accent-ink:#fff; --hl:#ffe36e;
  --radius:14px; --shadow:0 1px 0 rgba(0,0,0,.03),0 8px 24px -12px rgba(40,30,0,.18);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121210;--paper:#1b1a17;--ink:#f2efe7;--ink-2:#bdb8ad;--ink-3:#8a857b;
    --line:#2f2d28;--accent:#7ea0ff;--accent-ink:#0e1530;--hl:#6b5a12;
    --shadow:0 1px 0 rgba(255,255,255,.02),0 8px 24px -12px rgba(0,0,0,.6);}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 96px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:18px;padding:4px 0 16px}
.brand small{font-weight:500;color:var(--ink-3);font-size:12px;margin-left:6px;letter-spacing:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 22px}
h1{font-size:28px;line-height:1.3;letter-spacing:-.03em;margin:4px 0 14px}
.mark{background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 2px}
.lead{color:var(--ink-2);margin:0 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:12px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none}
.fine{font-size:12.5px;line-height:1.55;color:var(--ink-3);border-top:1px dashed var(--line);margin-top:22px;padding-top:14px}
.fine p{margin:0 0 4px}
.fine p::before{content:"* ";}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">fineprint<small>금융 약관 설문</small></div>
  <section class="card">
    <h1>설문이 <span class="mark">마감</span>되었어요</h1>
    <p class="lead">참여해 주신 모든 분께 감사드려요. 2026년 10월 8일에 응답 접수를 마쳤어요.
    모아 주신 답변은 금융 약관을 근거와 함께 읽어 주는 AI, <b>fineprint</b>의 첫 기능을 정하는 데 쓰였어요.</p>
    <a class="btn" href="https://github.com/Jeon-ChaeA/fineprint/blob/main/research/survey-results.md">설문 결과 보기</a>
    <div class="fine">
      <p>응답은 익명으로 처리했고, 공개 자료에는 집계 결과와 익명 인용만 담았어요.</p>
      <p>이 설문은 금융상품을 권유하지 않아요.</p>
    </div>
  </section>
</main>
</body>
</html>
